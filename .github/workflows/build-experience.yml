name: V5 Desarrollo - Validacion sin publicar

on:
  push:
    branches:
      - development-v5
    paths:
      - "experience-v2/**"
      - ".github/workflows/build-experience.yml"
  pull_request:
    paths:
      - "experience-v2/**"
      - ".github/workflows/build-experience.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experience-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install
      - name: Verificar rutas, enlaces y progresion climatica
        run: npm run test:v5
      - name: Verificar compilacion
        run: npm run build
      - name: Crear preview offline V5
        run: npm run build:offline
      - name: Verificar integridad del HTML offline
        run: npm run test:offline
      - name: Guardar preview sin publicar
        uses: actions/upload-artifact@v4
        with:
          name: SARA-V5-PREVIEW
          path: experience-v2/dist-offline/SARA_V4_OFFLINE.html
          if-no-files-found: error
